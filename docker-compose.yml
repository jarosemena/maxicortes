services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: maxicortes-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maxicortes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maxicortes-network

  # Backend API (.NET)
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: maxicortes-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=maxicortes;Username=postgres;Password=postgres
      - OptimizationService__UseRealService=false
      - OptimizationService__BaseUrl=http://localhost:8000
      - OptimizationService__TimeoutSeconds=300
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - maxicortes-network
    restart: unless-stopped

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.dev
    container_name: maxicortes-frontend
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_API_TIMEOUT=30000
      - VITE_ENABLE_DEVTOOLS=true
      - VITE_ENABLE_MOCK_DATA=false
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - maxicortes-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: maxicortes-postgres-data

networks:
  maxicortes-network:
    name: maxicortes-network
    driver: bridge
