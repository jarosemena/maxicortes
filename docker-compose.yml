version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: maxicortes-postgres
    environment:
      POSTGRES_DB: maxicortes
      POSTGRES_USER: maxicortes
      POSTGRES_PASSWORD: maxicortes123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - maxicortes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxicortes -d maxicortes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: maxicortes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - maxicortes-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optimization Engine (Python FastAPI)
  optimization-engine:
    build:
      context: ./optimization-engine
      dockerfile: Dockerfile
    container_name: maxicortes-optimization
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - MAX_WORKERS=4
      - ALGORITHM_TIMEOUT=300
    volumes:
      - ./optimization-engine:/app
      - optimization_cache:/app/cache
    networks:
      - maxicortes-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend API (.NET Core)
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: maxicortes-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=maxicortes;Username=maxicortes;Password=maxicortes123;
      - Redis__ConnectionString=redis:6379
      - OptimizationEngine__BaseUrl=http://optimization-engine:8000
      - JWT__SecretKey=your-super-secret-jwt-key-here-change-in-production
      - JWT__Issuer=MaxiCortes
      - JWT__Audience=MaxiCortes-Users
      - JWT__ExpirationMinutes=60
    volumes:
      - ./backend-api:/app
      - backend_uploads:/app/uploads
    networks:
      - maxicortes-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      optimization-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Web (React)
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      target: development
    container_name: maxicortes-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
      - VITE_APP_NAME=MaxiCortes
      - VITE_APP_VERSION=1.0.0
      - VITE_ENABLE_MOCK_API=false
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    networks:
      - maxicortes-network
    depends_on:
      backend-api:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: maxicortes-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - maxicortes-network
    depends_on:
      - frontend-web
      - backend-api
    profiles:
      - production
    restart: unless-stopped

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: maxicortes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - maxicortes-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: maxicortes-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - maxicortes-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  optimization_cache:
    driver: local
  backend_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  maxicortes-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16